    <script>
    (function () {
        if (localStorage.getItem('akari_setupComplete')) return;
        var keys = ['selectedWakeScript','selectedAvatarScript','selectedAIScript','selectedReflexScript','selectedVoiceScript','selectedBKGURL'];
        var hasConfig = keys.some(function (k) { return !!localStorage.getItem(k); });
        if (hasConfig) { localStorage.setItem('akari_setupComplete', '1'); return; }
        location.replace('./setup.html');
    })();
