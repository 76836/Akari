<!DOCTYPE HTML>
<html id="html">
<head>
    <title>Akari v2.6</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="./app.webmanifest">
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
    <link rel="shortcut icon" href="./images/favicon.ico">
    <meta name="msapplication-TileColor" content="#603cba">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <script>
    (function () {
        if (localStorage.getItem('akari_setupComplete')) return;
        var keys = ['selectedWakeScript','selectedAvatarScript','selectedAIScript','selectedReflexScript','selectedVoiceScript','selectedBKGURL'];
        var hasConfig = keys.some(function (k) { return !!localStorage.getItem(k); });
        if (hasConfig) { localStorage.setItem('akari_setupComplete', '1'); return; }
        location.replace('./setup.html');
    })();
    </script>
    <style>
        :root {
            color-scheme: dark;
            --notification-bg: rgba(17, 24, 39, 0.8);
            --notification-text: #edf6ff;
            --notification-subtext: rgba(191, 219, 254, 0.82);
            --bg-1: #020817;
            --bg-2: #0b1220;
            --bg-3: #111827;
            --panel-bg: rgba(15, 23, 42, 0.68);
            --panel-strong: rgba(15, 23, 42, 0.9);
            --panel-border: rgba(148, 163, 184, 0.22);
            --text: #ecf7ff;
            --muted: #b6c7e6;
            --accent: #7dd3fc;
            --accent-2: #a78bfa;
            --success: #5eead4;
            --danger: #f87171;
            --shadow: rgba(2, 6, 23, 0.7);
            --input-bg: rgba(15, 23, 42, 0.7);
            --input-border: rgba(125, 211, 252, 0.4);
            --scrollbar: rgba(148, 163, 184, 0.4);
            --ice-blur: 12px;
            --ice-tint: rgba(17, 24, 39, 0.58);
            --ice-tint-dark: rgba(2, 6, 23, 0.7);
            --ice-border: rgba(148, 163, 184, 0.28);
            --ice-glow: rgba(125, 211, 252, 0.18);
            --ice-shadow: rgba(2, 6, 23, 0.5);
            --ice-frost-medium: rgba(96, 165, 250, 0.2);
            --ice-radius-sm: 20px;
            --ice-input-text: #edf6ff;
            --ice-input-placeholder: rgba(191, 219, 254, 0.55);
        }
        html, body {
            margin: 0; height: 100%; width: 100%;
            background: #000;
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }
        .icemorphic {
            backdrop-filter: blur(var(--ice-blur)) url(#ice-refraction);
            -webkit-backdrop-filter: blur(var(--ice-blur)) url(#ice-refraction);
            background: var(--ice-tint);
            border: 1.5px solid var(--ice-border);
            box-shadow: 0 8px 32px var(--ice-shadow), inset 0 0 20px var(--ice-glow);
            -webkit-tap-highlight-color: transparent; outline: none; color: var(--ice-input-text);
        }
        .icemorphic-dark { --ice-tint: var(--ice-tint-dark); --ice-border: rgba(255, 255, 255, 0.2); --ice-glow: rgba(0, 0, 0, 0.3); }
        .icemorphic-medium { --ice-tint: var(--ice-frost-medium); --ice-blur: 12px; }
        .ice-button {
            border-radius: var(--ice-radius-sm); padding: 12px 24px; border: none; cursor: pointer;
            transition: all 0.3s ease; color: white; font-weight: 500; height: 48px; line-height: 1.5;
            box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none;
        }
        .ice-button:hover { --ice-glow: rgba(255, 255, 255, 0.6); transform: translateY(-1px); }
        .ice-input {
            padding: 12px 18px; border-radius: var(--ice-radius-sm); border: none; color: var(--ice-input-text);
            font-size: 1rem; outline: none; width: 100%; transition: all 0.3s ease; height: 48px;
            line-height: 1.5; box-sizing: border-box; background: rgba(15, 23, 42, 0.16);
        }
        .ice-input::placeholder { color: var(--ice-input-placeholder); }
        .ice-input:focus { --ice-glow: rgba(255, 255, 255, 0.6); }
        * { scrollbar-color: var(--scrollbar) transparent; }
        .notification-container {
            position: fixed; top: 100px; right: 0; margin: 0; padding: 16px;
            background: var(--notification-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border); border-bottom-left-radius: 12px; border-top-left-radius: 12px;
            width: 320px; transform: translateX(100%); opacity: 0;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s ease-in-out;
            z-index: 200; display: flex; align-items: flex-end; gap: 12px;
            color: var(--notification-text); box-shadow: 0 4px 24px var(--shadow);
        }
        .notification-container.show { transform: translateX(0); opacity: 1; }
        .notification-container.animated-border::before {
            content: ''; position: absolute; inset: 0; border: 3px solid transparent; border-right: none;
            border-top-left-radius: 12px; border-bottom-left-radius: 12px;
            background: linear-gradient(var(--notification-bg), var(--notification-bg)) padding-box,
                repeating-linear-gradient(var(--angle, 0deg), var(--border-colors)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out; mask-composite: exclude;
            animation: rotate 4s linear infinite, glow 2s ease-in-out infinite alternate;
        }
        @keyframes rotate { 0% { --angle: 0deg; } 100% { --angle: 360deg; } }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 15px rgba(var(--glow-color), 1)); }
            100% { filter: drop-shadow(0 0 25px rgba(var(--glow-color), 1)); }
        }
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        .notification-image { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .notification-content { flex-grow: 1; margin-right: 24px; }
        .notification-title { font-weight: bold; margin-bottom: 4px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
        .notification-body { color: var(--notification-subtext); font-size: 0.9em; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 98vh; background-color: black;
            opacity: 1; transition: opacity 0.5s ease-out; z-index: 300; border-bottom: 2vh solid red;
            animation: borderAnim 2.5s forwards; display: flex; flex-direction: column;
        }
        @keyframes borderAnim { 0% { border-color: red; } 100% { border-color: green; } }
        #overlay.fade-out { opacity: 0; pointer-events: none; }
        /* Wallpaper layer — simple fixed stack under avatar (z-index 0 < avatar iframe z-index 1) */
        #bkg-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            margin: 0;
            padding: 0;
            border: 0;
            overflow: hidden;
            background: transparent;
            pointer-events: none;
        }
        #bkg-container > iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            padding: 0;
            background: transparent;
            pointer-events: none;
        }
        #avatar {
            position: relative;
            z-index: 1;
            background: transparent;
        }
        #screensaver-container {
            position: fixed; inset: 0; display: none; z-index: 999998; background: #000; pointer-events: none;
        }
        #screensaver-container.active { display: block; pointer-events: auto; }
        #screensaver-container .screensaver-media { width: 100%; height: 100%; border: none; object-fit: cover; }
        #screensaver-container .screensaver-input-shield {
            position: absolute; inset: 0; background: transparent; z-index: 1; pointer-events: auto;
        }
        .chat-box {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: min(92vw, 720px); max-height: 60vh; display: flex; flex-direction: column;
            background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px;
            padding: 12px; box-shadow: 0 20px 50px var(--shadow); z-index: 60;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            box-sizing: border-box;
        }
        .chat-box.collapsed { height: auto; width: min(88vw, 720px); max-height: 160px; }
        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; height: 20px; gap: 8px;
        }
        .chat-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-left: auto; padding-right: 4px; }
        .chat-title { font-weight: 700; font-size: 0.75rem; color: var(--text); padding-left: 10px; margin-right: auto; }
        #settingsButton, #historyButton, #chatToggle {
            background: rgba(15, 23, 42, 0.35); border: 1px solid var(--panel-border); color: var(--text);
            width: 38px; min-width: 38px; height: 18px; padding: 0 8px; border-radius: 8px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 16px; line-height: 1;
            overflow: hidden; white-space: nowrap;
        }
        #chat-history-sidebar {
            position: fixed; top: 0; left: 0; width: min(86vw, 320px); height: 100%;
            z-index: 120; transform: translateX(-105%); transition: transform 0.28s ease;
            background: var(--panel-strong); border-right: 1px solid var(--panel-border);
            backdrop-filter: blur(12px); display: flex; flex-direction: column;
            box-shadow: 8px 0 32px var(--shadow);
        }
        #chat-history-sidebar.open { transform: translateX(0); }
        #chat-history-sidebar .hist-header {
            display: flex; align-items: center; gap: 8px; padding: 12px;
            border-bottom: 1px solid var(--panel-border);
        }
        #chat-history-sidebar .hist-header h3 { margin: 0; font-size: 0.85rem; flex: 1; color: var(--text); }
        #chat-history-search {
            margin: 8px 12px; padding: 10px 12px; border-radius: 12px;
            border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text);
            outline: none; font-size: 0.9rem;
        }
        #chat-history-list {
            flex: 1; overflow-y: auto; padding: 4px 8px 16px; display: flex; flex-direction: column; gap: 4px;
        }
        .hist-item {
            text-align: left; padding: 10px 12px; border-radius: 12px; cursor: pointer;
            border: 1px solid transparent; background: transparent; color: var(--text);
            font-size: 0.85rem; line-height: 1.3; font-family: inherit;
        }
        .hist-item:hover { background: rgba(125, 211, 252, 0.08); }
        .hist-item.active { border-color: var(--accent); background: rgba(125, 211, 252, 0.12); }
        .hist-item .hist-meta { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
        .hist-item .hist-del {
            float: right; opacity: 0.5; border: none; background: transparent; color: var(--danger);
            cursor: pointer; font-size: 0.85rem; padding: 0 4px;
        }
        #hist-new-btn {
            margin: 0 12px 10px; padding: 8px; border-radius: 12px; cursor: pointer;
            border: 1px solid var(--panel-border); background: rgba(125, 211, 252, 0.1);
            color: var(--accent); font-weight: 600; font-size: 0.8rem; font-family: inherit;
        }
        #hist-backdrop {
            position: fixed; inset: 0; background: rgba(2,6,23,0.45); z-index: 110;
            opacity: 0; pointer-events: none; transition: opacity 0.25s;
        }
        #hist-backdrop.show { opacity: 1; pointer-events: auto; }

        #messages-container { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; transition: all 0.3s ease; }
        .chat-box.collapsed #messages-container > div { display: none; }
        .chat-box.collapsed #messages-container > div:nth-last-child(-n+2) {
            display: block; opacity: 0.8; transform: scale(0.95); pointer-events: none;
        }
        .responsetxt, .command {
            padding: 10px 16px; font-size: 0.95rem; line-height: 1.4;
            box-shadow: 0 4px 12px rgba(2, 6, 23, 0.18); border-radius: 15px; border: 1px solid var(--panel-border);
        }
        .responsetxt {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.94), rgba(15, 23, 42, 0.92));
            border-bottom-left-radius: 4px; color: var(--text);
        }
        .command {
            background: linear-gradient(135deg, rgba(13, 70, 80, 0.82), rgba(10, 25, 35, 0.82));
            border-bottom-right-radius: 4px; color: var(--success);
        }
        /* Thinking / chain-of-thought panels */
        .think-block {
            margin: 0 0 8px 0; border-radius: 12px; border: 1px solid rgba(167, 139, 250, 0.35);
            background: rgba(88, 28, 135, 0.22); overflow: hidden;
        }
        .think-block summary {
            cursor: pointer; padding: 8px 12px; font-size: 0.75rem; font-weight: 600;
            color: #c4b5fd; list-style: none; display: flex; align-items: center; gap: 6px;
            user-select: none;
        }
        .think-block summary::-webkit-details-marker { display: none; }
        .think-block summary::before { content: '▸'; font-size: 0.7rem; opacity: 0.8; transition: transform 0.15s; }
        .think-block[open] summary::before { transform: rotate(90deg); }
        .think-block .think-body {
            padding: 0 12px 10px; font-size: 0.8rem; line-height: 1.45;
            color: rgba(226, 232, 240, 0.78); white-space: pre-wrap; word-break: break-word;
            border-top: 1px solid rgba(167, 139, 250, 0.2); max-height: 40vh; overflow-y: auto;
        }
        .controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: min(92vw, 760px); display: flex; justify-content: center; align-items: center;
            gap: 8px; padding: 0 8px; box-sizing: border-box; z-index: 50;
        }
