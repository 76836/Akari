<!DOCTYPE HTML>
<html id="html">
<head>
    <title>Akari Beta UI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../app.webmanifest">
    <meta charset="utf-8" />
    <link rel="apple-touch-icon" sizes="180x180" href="../images/apple-touch-icon.png">
    <link rel="shortcut icon" href="../images/favicon.ico">
    <meta name="msapplication-TileColor" content="#603cba">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">
    <script>
    (function () {
        if (localStorage.getItem('akari_setupComplete')) return;
        var keys = ['selectedWakeScript','selectedAvatarScript','selectedAIScript','selectedReflexScript','selectedVoiceScript','selectedBKGURL'];
        var hasConfig = keys.some(function (k) { return !!localStorage.getItem(k); });
        if (hasConfig) { localStorage.setItem('akari_setupComplete', '1'); return; }
        location.replace('../setup.html');
    })();
    </script>
    <style>
        :root {
            color-scheme: dark;
            --notification-bg: rgba(17, 24, 39, 0.8);
            --notification-text: #edf6ff;
            --notification-subtext: rgba(191, 219, 254, 0.82);
            --bg-1: #020817;
            --bg-2: #0b1220;
            --bg-3: #111827;
            --panel-bg: rgba(15, 23, 42, 0.68);
            --panel-strong: rgba(15, 23, 42, 0.9);
            --panel-border: rgba(148, 163, 184, 0.22);
            --text: #ecf7ff;
            --muted: #b6c7e6;
            --accent: #7dd3fc;
            --accent-2: #a78bfa;
            --success: #5eead4;
            --danger: #f87171;
            --shadow: rgba(2, 6, 23, 0.7);
            --input-bg: rgba(15, 23, 42, 0.7);
            --input-border: rgba(125, 211, 252, 0.4);
            --scrollbar: rgba(148, 163, 184, 0.4);
            --ice-blur: 12px;
            --ice-tint: rgba(17, 24, 39, 0.58);
            --ice-tint-dark: rgba(2, 6, 23, 0.7);
            --ice-border: rgba(148, 163, 184, 0.28);
            --ice-glow: rgba(125, 211, 252, 0.18);
            --ice-shadow: rgba(2, 6, 23, 0.5);
            --ice-frost-medium: rgba(96, 165, 250, 0.2);
            --ice-radius-sm: 20px;
            --ice-input-text: #edf6ff;
            --ice-input-placeholder: rgba(191, 219, 254, 0.55);
        }
        html, body {
            margin: 0; height: 100%; width: 100%;
            background: radial-gradient(circle at top, var(--bg-3) 0%, var(--bg-2) 35%, var(--bg-1) 100%);
            color: var(--text);
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
        }
        .icemorphic {
            backdrop-filter: blur(var(--ice-blur)) url(#ice-refraction);
            -webkit-backdrop-filter: blur(var(--ice-blur)) url(#ice-refraction);
            background: var(--ice-tint);
            border: 1.5px solid var(--ice-border);
            box-shadow: 0 8px 32px var(--ice-shadow), inset 0 0 20px var(--ice-glow);
            -webkit-tap-highlight-color: transparent; outline: none; color: var(--ice-input-text);
        }
        .icemorphic-dark { --ice-tint: var(--ice-tint-dark); --ice-border: rgba(255, 255, 255, 0.2); --ice-glow: rgba(0, 0, 0, 0.3); }
        .icemorphic-medium { --ice-tint: var(--ice-frost-medium); --ice-blur: 12px; }
        .ice-button {
            border-radius: var(--ice-radius-sm); padding: 12px 24px; border: none; cursor: pointer;
            transition: all 0.3s ease; color: white; font-weight: 500; height: 48px; line-height: 1.5;
            box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none;
        }
        .ice-button:hover { --ice-glow: rgba(255, 255, 255, 0.6); transform: translateY(-1px); }
        .ice-input {
            padding: 12px 18px; border-radius: var(--ice-radius-sm); border: none; color: var(--ice-input-text);
            font-size: 1rem; outline: none; width: 100%; transition: all 0.3s ease; height: 48px;
            line-height: 1.5; box-sizing: border-box; background: rgba(15, 23, 42, 0.16);
        }
        .ice-input::placeholder { color: var(--ice-input-placeholder); }
        .ice-input:focus { --ice-glow: rgba(255, 255, 255, 0.6); }
        * { scrollbar-color: var(--scrollbar) transparent; }
        .notification-container {
            position: fixed; top: 100px; right: 0; margin: 0; padding: 16px;
            background: var(--notification-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border); border-bottom-left-radius: 12px; border-top-left-radius: 12px;
            width: 320px; transform: translateX(100%); opacity: 0;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1), opacity 0.3s ease-in-out;
            z-index: 200; display: flex; align-items: flex-end; gap: 12px;
            color: var(--notification-text); box-shadow: 0 4px 24px var(--shadow);
        }
        .notification-container.show { transform: translateX(0); opacity: 1; }
        .notification-container.animated-border::before {
            content: ''; position: absolute; inset: 0; border: 3px solid transparent; border-right: none;
            border-top-left-radius: 12px; border-bottom-left-radius: 12px;
            background: linear-gradient(var(--notification-bg), var(--notification-bg)) padding-box,
                repeating-linear-gradient(var(--angle, 0deg), var(--border-colors)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out; mask-composite: exclude;
            animation: rotate 4s linear infinite, glow 2s ease-in-out infinite alternate;
        }
        @keyframes rotate { 0% { --angle: 0deg; } 100% { --angle: 360deg; } }
        @keyframes glow {
            0% { filter: drop-shadow(0 0 15px rgba(var(--glow-color), 1)); }
            100% { filter: drop-shadow(0 0 25px rgba(var(--glow-color), 1)); }
        }
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        .notification-image { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; flex-shrink: 0; }
        .notification-content { flex-grow: 1; margin-right: 24px; }
        .notification-title { font-weight: bold; margin-bottom: 4px; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
        .notification-body { color: var(--notification-subtext); font-size: 0.9em; }
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 98vh; background-color: black;
            opacity: 1; transition: opacity 0.5s ease-out; z-index: 300; border-bottom: 2vh solid red;
            animation: borderAnim 2.5s forwards; display: flex; flex-direction: column;
        }
        @keyframes borderAnim { 0% { border-color: red; } 100% { border-color: green; } }
        #overlay.fade-out { opacity: 0; pointer-events: none; }
        /* Wallpaper layer — same stacking as root index.html */
        #bkg-container {
            position: fixed; inset: 0; z-index: -2; width: 100vw; height: 100vh;
            pointer-events: none; overflow: hidden;
        }
        #bkg-container iframe.iframe-container,
        #bkg-container img {
            position: absolute; inset: 0; width: 100%; height: 100%;
            border: none; object-fit: cover; pointer-events: none;
        }
        #avatar { position: relative; z-index: 1; }
        #screensaver-container {
            position: fixed; inset: 0; display: none; z-index: 999998; background: #000; pointer-events: none;
        }
        #screensaver-container.active { display: block; pointer-events: auto; }
        #screensaver-container .screensaver-media { width: 100%; height: 100%; border: none; object-fit: cover; }
        #screensaver-container .screensaver-input-shield {
            position: absolute; inset: 0; background: transparent; z-index: 1; pointer-events: auto;
        }
        .chat-box {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            width: min(92vw, 720px); max-height: 60vh; display: flex; flex-direction: column;
            background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px;
            padding: 12px; box-shadow: 0 20px 50px var(--shadow); z-index: 60;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            box-sizing: border-box;
        }
        .chat-box.collapsed { height: auto; width: min(88vw, 720px); max-height: 160px; }
        .chat-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; height: 20px; gap: 8px;
        }
        .chat-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-left: auto; padding-right: 4px; }
        .chat-title { font-weight: 700; font-size: 0.75rem; color: var(--text); padding-left: 10px; margin-right: auto; }
        #settingsButton, #chatToggle {
            background: rgba(15, 23, 42, 0.35); border: 1px solid var(--panel-border); color: var(--text);
            width: 38px; min-width: 38px; height: 18px; padding: 0 8px; border-radius: 8px; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 18px; line-height: 1;
            overflow: hidden; white-space: nowrap;
        }
        #messages-container { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; transition: all 0.3s ease; }
        .chat-box.collapsed #messages-container > div { display: none; }
        .chat-box.collapsed #messages-container > div:nth-last-child(-n+2) {
            display: block; opacity: 0.8; transform: scale(0.95); pointer-events: none;
        }
        .responsetxt, .command {
            padding: 10px 16px; font-size: 0.95rem; line-height: 1.4;
            box-shadow: 0 4px 12px rgba(2, 6, 23, 0.18); border-radius: 15px; border: 1px solid var(--panel-border);
        }
        .responsetxt {
            background: linear-gradient(135deg, rgba(31, 41, 55, 0.94), rgba(15, 23, 42, 0.92));
            border-bottom-left-radius: 4px; color: var(--text);
        }
        .command {
            background: linear-gradient(135deg, rgba(13, 70, 80, 0.82), rgba(10, 25, 35, 0.82));
            border-bottom-right-radius: 4px; color: var(--success);
        }
        .controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: min(92vw, 760px); display: flex; justify-content: center; align-items: center;
            gap: 8px; padding: 0 8px; box-sizing: border-box; z-index: 50;
        }
        .controls .ice-button {
            flex: 0 0 auto; min-width: 44px; width: auto; padding: 0 12px;
            display: flex; align-items: center; justify-content: center;
        }
        .controls .ice-button.side-action {
            background: var(--input-bg) !important; border: none !important;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04) !important; color: var(--text) !important;
        }
        .controls #box { flex: 1 1 auto; width: auto; max-width: none; min-width: 120px; }
        .box {
            background: var(--input-bg); border: 2px solid var(--input-border); color: var(--text);
            padding: 12px; border-radius: 20px; outline: none;
            transition: border-color 0.3s, box-shadow 0.3s ease; pointer-events: auto;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }
        .box:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(125, 211, 252, 0.18); }
        .button-long, .toggle-btn {
            color: white; padding: 10px 20px; border-radius: 20px; cursor: pointer;
            font-family: inherit; font-size: 14px; pointer-events: auto;
        }
        .mic-on { background: #00ff00 !important; color: black !important; }
        .toggle-btn { background: rgba(15, 23, 42, 0.45); border: 1px solid var(--panel-border); color: var(--text); }
        .windowstyle {
            border: 4px solid var(--panel-border); background: rgba(2, 6, 23, 0.9);
            width: 86vw; height: 80vh; position: fixed; top: 7vh; left: 7vw; z-index: 100;
            border-radius: 10px 10px 0px 0px;
        }
        .close-btn {
            position: fixed; top: 87vh; left: 7vw; background: rgba(127, 29, 29, 0.8); color: var(--text);
            font-weight: bolder; border: 2px solid var(--danger); padding: 10px;
            border-radius: 0px 0px 10px 10px; width: calc(86vw + 2px); z-index: 101;
        }
        #legacy-anchor { display: none; position: absolute; }
        #status-area { position: fixed; bottom: 80px; left: 20px; color: var(--muted); z-index: 51; }
    </style>
</head>
<body>
    <div id="bkg-container"></div>
    <div id="avatar"></div>
    <div id="overlay">
        <div class="console" id="boot-log" style="font-size: 1rem; color: #fff;"></div>
        <img src="../images/logo512.png" alt="Logo" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%) scale(0.6);">
        <img src="../images/loading.gif" alt="Loading" style="position:fixed; top:65%; left:50%; transform:translate(-50%, -50%) scale(0.2);">
    </div>
    <div id="legacy-anchor"><div id="messages"></div></div>
    <div id="notificationArea" style="position: fixed; top: 0; right: 0; z-index: 200;"></div>
    <div id="screensaver-container" aria-hidden="true"></div>
    <div id="chat-box" class="icemorphic chat-box collapsed" style="border: none;" aria-live="polite">
        <div class="chat-header">
            <button id="settingsButton" class="icemorphic toggle-btn" onclick="app.ui.openWindow('../settings/index.html')" aria-label="Open settings">⚙</button>
            <div class="chat-title">loading...</div>
            <div class="chat-actions">
                <button id="chatToggle" class="icemorphic toggle-btn" aria-label="Toggle Chat">+</button>
            </div>
        </div>
        <div id="messages-container" role="log"></div>
    </div>
    <div id="status-area"></div>
    <div id="window-layer"></div>
    <div class="controls">
        <input type="text" id="box" class="icemorphic icemorphic-medium ice-input box" style="color: var(--text); background: var(--input-bg);" placeholder="What's up?" onkeydown="if(event.keyCode==13) app.core.handleInput()" oninput="app.core.syncActionButton()">
        <button class="icemorphic-medium ice-button side-action" id="micbutton" onclick="app.core.onActionButton()" style="font-weight: bolder; min-width: 72px;">voice</button>
    </div>
    <script>
    (function () {
        function injectSVGFilter() {
            if (document.getElementById('ice-refraction')) return;
            if (!document.body) { setTimeout(injectSVGFilter, 10); return; }
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('style', 'position: absolute; width: 0; height: 0; pointer-events: none;');
            svg.innerHTML = '<filter id="ice-refraction"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" result="noise" /><feDisplacementMap in="SourceGraphic" in2="noise" scale="75" xChannelSelector="R" yChannelSelector="G" /></filter>';
            document.body.appendChild(svg);
        }
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', injectSVGFilter);
        else setTimeout(injectSVGFilter, 0);
        window.Icemorphic = {
            version: '1.0.0',
            setDistortion: function (scale) {
                const filter = document.querySelector('#ice-refraction feDisplacementMap');
                if (filter) filter.setAttribute('scale', scale);
            },
            setBlur: function (blur) { document.documentElement.style.setProperty('--ice-blur', blur + 'px'); },
            setTint: function (rgba) { document.documentElement.style.setProperty('--ice-tint', rgba); },
            reinjectFilter: function () {
                const existing = document.getElementById('ice-refraction');
                if (existing && existing.parentElement) existing.parentElement.remove();
                injectSVGFilter();
            }
        };
    })();
    </script>
    <script>
    (function () {
        var titleElement = document.querySelector('.chat-title');
        if (titleElement) {
            var today = new Date();
            var day = today.getDate();
            var month = today.toLocaleString('default', { month: 'long' });
            var year = today.getFullYear();
            var suffix = (day % 10 === 1 && day !== 11) ? 'st' : (day % 10 === 2 && day !== 12) ? 'nd' : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
            titleElement.textContent = month + ' ' + day + suffix + ', ' + year;
        }
    })();
    </script>
    <script src="../engine/autopilot/bridge.js"></script>
    <script src="https://76836.github.io/AkariNet-Automata/ATPKLoader-1.1.0.js"></script>
    <script>
(function() {
    'use strict';
    const _eventHandlers = new Map();
    window.on = function(eventName, handler) {
        const handlerId = Math.random().toString(36).substr(2, 9);
        const wrapper = (e) => handler(e.detail);
        if (!_eventHandlers.has(eventName)) _eventHandlers.set(eventName, new Map());
        _eventHandlers.get(eventName).set(handlerId, wrapper);
        window.addEventListener(eventName, wrapper);
        return handlerId;
    };
    window.emit = function(eventName, data) {
        window.dispatchEvent(new CustomEvent(eventName, { detail: data }));
    };
    async function initAkariAutomata() {
        if (typeof AutomatonLoader === 'undefined') return;
        const loader = new AutomatonLoader();
        window.automatonLoader = loader;
        const defaultUrl = 'https://76836.github.io/AkariNet-Automata/demo.atpk';
        let urls = [], blacklist = [];
        try { urls = JSON.parse(localStorage.getItem('akari:automata_urls') || '[]'); if (!Array.isArray(urls)) urls = []; } catch { urls = []; }
        try { blacklist = JSON.parse(localStorage.getItem('akari:automata_blacklist') || '[]'); if (!Array.isArray(blacklist)) blacklist = []; } catch { blacklist = []; }
        if (urls.length === 0) { urls = [defaultUrl]; localStorage.setItem('akari:automata_urls', JSON.stringify(urls)); }
        loader.setAutomataUrls(urls);
        loader.setBlacklist(blacklist);
        if (window.AkariAutopilot) AkariAutopilot.beginDownload('Loading Automata…');
        await loader.loadAll();
        if (window.AkariAutopilot) AkariAutopilot.endDownload('Automata ready');
    }
    if (document.readyState === 'complete') initAkariAutomata();
    else window.addEventListener('load', initAkariAutomata);
})();
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js').catch(function () {});
}
    </script>
    <script>
        window.serverStatus = "connected";
        window.loadscreen = (msg) => app.ui.log(msg);
        window.say = (text) => app.core.say(text);
        window.bubble = (text) => app.core.appendBubble(text, 'responsetxt');
        window.bubble_incoming = (text) => app.core.appendBubble(text, 'command');
        window.emote = (text) => localStorage.setItem("emote", text);
        window.showNotification = (t, m, o) => app.notify(t, m, o);
        window.newwindow = (url) => app.ui.openWindow(url);
        window.goakari = () => {
            window.dispatchEvent(new CustomEvent('akari:user-input', { detail: { source: 'wake-word' } }));
            app.core.toggleVoice();
        };
        window.speak = (text) => {
            if (typeof window.speakt5 === 'function') window.speakt5(text);
            else if ('speechSynthesis' in window) window.speechSynthesis.speak(new SpeechSynthesisUtterance(text));
        };
        var AKARI_ROOT = 'https://76836.github.io/Akari/';
        function resolveModulePath(src) {
            if (!src || src === 'off') return src;
            if (/^(https?:|data:|blob:|\/\/)/i.test(src)) return src;
            if (src.startsWith('../') || src.startsWith('/')) return src;
            if (src.startsWith('./')) return '../' + src.slice(2);
            return '../' + src;
        }
        function resolveAssetUrl(url) {
            if (!url) return url;
            if (/^(https?:|data:|blob:|\/\/)/i.test(url)) return url;
            return AKARI_ROOT + String(url).replace(/^\.\//, '');
        }
        const app = window.app = {
            isSilentMode: true,
            autoMinTimer: null,
            screensaverTimer: null,
            screensaverActive: false,
            config: {
                modules: {
                    voice: localStorage.getItem('selectedVoiceScript'),
                    avatar: localStorage.getItem('selectedAvatarScript'),
                    ai: localStorage.getItem('selectedAIScript') || './characters/akari/pollinations.js',
                    reflex: localStorage.getItem('selectedReflexScript') || './characters/akari/response.js',
                    whisper: localStorage.getItem('selectedWhisperScript') || './engine/web-speech-recognition.js',
                    wake: localStorage.getItem('selectedWakeScript') || './characters/akari/wake.js',
                    bg: localStorage.getItem('selectedBKGURL') || 'https://76836.github.io/squares'
                }
            },
            notify: (title, message, options = {}) => {
                const { duration = 5000, borderColors, borderColor, image } = options;
                const container = document.getElementById('notificationArea');
                const note = document.createElement('div');
                note.className = 'notification-container';
                let colors = borderColors || (borderColor ? [borderColor, borderColor] : null);
                if (colors) {
                    note.classList.add('animated-border');
                    note.style.setProperty('--border-colors', colors.join(', '));
                    note.style.setProperty('--glow-color', (colors[0].match(/\d+/g) || ['255','255','255']).join(','));
                }
                note.innerHTML = (image ? '<img src="'+image+'" class="notification-image">' : '') +
                    '<div class="notification-content"><div class="notification-title">'+title+'</div><div class="notification-body">'+message+'</div></div>' +
                    '<button class="notification-close" style="position:absolute;top:12px;right:12px;width:20px;height:20px;border:none;background:none;cursor:pointer;color:white;">✕</button>';
                container.prepend(note);
                requestAnimationFrame(() => note.classList.add('show'));
                const close = () => { note.classList.remove('show'); setTimeout(() => note.remove(), 400); };
                note.querySelector('.notification-close').onclick = close;
                if (duration) setTimeout(close, duration);
            },
            ui: {
                log: (msg) => { const log = document.getElementById('boot-log'); if (log) log.innerHTML += msg + '<br>'; },
                resetMic: () => {
                    if (window.whisperTranscriber && whisperTranscriber.stop) whisperTranscriber.stop();
                    app.core.syncActionButton(true);
                },
                openWindow: (url) => {
                    document.getElementById('window-layer').innerHTML =
                        '<iframe src="'+url+'" class="icemorphic icemorphic-dark windowstyle"></iframe><button class="icemorphic icemorphic-dark close-btn" onclick="app.ui.closeWindow()">Close Window</button>';
                },
                closeWindow: () => document.getElementById('window-layer').innerHTML = '',
                setTyping: (name) => { document.getElementById('status-area').innerText = name ? name + ' is thinking...' : ''; },
                toggleChat: (forceState) => {
                    const box = document.getElementById('chat-box');
                    const btn = document.getElementById('chatToggle');
                    if (!box || !btn) return;
                    const isClosed = box.classList.contains('collapsed');
                    const shouldClose = forceState === 'min' || (!isClosed && forceState !== 'open');
                    if (shouldClose) {
                        box.classList.add('collapsed'); btn.innerText = '+'; clearTimeout(app.autoMinTimer);
                    } else {
                        box.classList.remove('collapsed'); btn.innerText = '-'; app.ui.resetAutoMin();
                    }
                    const container = document.getElementById('messages-container');
                    if (container) container.scrollTop = container.scrollHeight;
                },
                resetAutoMin: () => {
                    clearTimeout(app.autoMinTimer);
                    app.autoMinTimer = setTimeout(() => app.ui.toggleChat('min'), 60000);
                }
            },
            core: {
                init: async () => {
                    if (window.AkariAutopilot) AkariAutopilot.attach(app);
                    app.ui.log('Akari Beta UI initializing...');
                    app.core.loadBackground();
                    app.core.initScreensaver();
                    await app.core.loadModule('avatar', app.config.modules.avatar, 'Avatar');
                    await app.core.loadModule('ai', app.config.modules.ai, 'AI Engine');
                    await app.core.loadModule('reflex', app.config.modules.reflex, 'Reflex Engine');
                    await app.core.loadModule('voice', app.config.modules.voice, 'Speech Synth');
                    await app.core.loadModule('wake', app.config.modules.wake, 'Wake Word');
                    await app.core.loadModule('whisper', app.config.modules.whisper, 'Speech Recognition');
                    setTimeout(() => {
                        const overlay = document.getElementById('overlay');
                        if (overlay) overlay.classList.add('fade-out');
                        const greet = app.core.getGreeting();
                        app.core.appendBubble(greet, 'responsetxt');
                        app.notify('Akari', greet);
                        window.emit('akari_ready', { timestamp: Date.now() });
                    }, 1000);
                },
                loadBackground: () => {
                    const url = app.config.modules.bg;
                    const container = document.getElementById('bkg-container');
                    if (!container) return;
                    container.innerHTML = '';
                    container.style.background = '';
                    container.style.backgroundImage = '';
                    if (!url) return;
                    const resolved = resolveAssetUrl(url);
                    // Clear opaque body/html fill so the wallpaper layer can show (z-index: -2 paints above transparent body bg)
                    document.documentElement.style.background = 'transparent';
                    document.body.style.background = 'transparent';
                    const isImage = /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(resolved) ||
                        /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(String(url));
                    if (isImage) {
                        container.style.backgroundImage = 'url("' + resolved + '")';
                        container.style.backgroundSize = 'cover';
                        container.style.backgroundPosition = 'center';
                        container.style.backgroundRepeat = 'no-repeat';
                        container.style.backgroundAttachment = 'fixed';
                    } else {
                        const ifr = document.createElement('iframe');
                        ifr.src = resolved;
                        ifr.className = 'iframe-container';
                        ifr.setAttribute('title', 'Wallpaper');
                        ifr.setAttribute('allow', 'autoplay');
                        ifr.setAttribute('loading', 'eager');
                        container.appendChild(ifr);
                    }
                    console.log('[Akari] wallpaper:', resolved);
                },
                getScreensaverConfig: () => {
                    const timeoutSec = parseInt(localStorage.getItem('selectedScreensaverTimeout') || '120', 10);
                    return {
                        enabled: localStorage.getItem('selectedScreensaverEnabled') === 'true',
                        url: localStorage.getItem('selectedScreensaverURL') || '',
                        timeoutMs: Math.max(10, isNaN(timeoutSec) ? 120 : timeoutSec) * 1000,
                        behavior: localStorage.getItem('selectedScreensaverResumeBehavior') || 'destroy'
                    };
                },
                buildScreensaverContent: (container, url) => {
                    container.innerHTML = '';
                    if (!url) return;
                    const resolved = resolveAssetUrl(url);
                    if (/\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(String(url)) || /\.(jpg|jpeg|png|gif|webp)(\?|$)/i.test(resolved)) {
                        const img = document.createElement('img');
                        img.className = 'screensaver-media'; img.src = resolved; img.alt = 'Screensaver';
                        container.appendChild(img);
                    } else {
                        const ifr = document.createElement('iframe');
                        ifr.className = 'screensaver-media'; ifr.src = resolved;
                        container.appendChild(ifr);
                    }
                    const inputShield = document.createElement('div');
                    inputShield.className = 'screensaver-input-shield';
                    container.appendChild(inputShield);
                },
                showScreensaver: () => {
                    const container = document.getElementById('screensaver-container');
                    if (!container || app.screensaverActive) return;
                    const cfg = app.core.getScreensaverConfig();
                    if (!cfg.enabled || !cfg.url) return;
                    if (!container.firstChild || cfg.behavior === 'destroy') {
                        app.core.buildScreensaverContent(container, cfg.url);
                    }
                    container.classList.add('active');
                    app.screensaverActive = true;
                    window.emit('screensaver_shown', { url: cfg.url, timestamp: Date.now() });
                },
                hideScreensaver: (source) => {
                    source = source || 'activity';
                    const container = document.getElementById('screensaver-container');
                    if (!container || !app.screensaverActive) return;
                    const cfg = app.core.getScreensaverConfig();
                    container.classList.remove('active');
                    if (cfg.behavior !== 'background') container.innerHTML = '';
                    app.screensaverActive = false;
                    window.emit('screensaver_hidden', { source: source, behavior: cfg.behavior, timestamp: Date.now() });
                },
                registerUserActivity: (source) => {
                    source = source || 'activity';
                    clearTimeout(app.screensaverTimer);
                    const cfg = app.core.getScreensaverConfig();
                    if (source !== 'init') app.core.hideScreensaver(source);
                    if (!cfg.enabled || !cfg.url) return;
                    app.screensaverTimer = setTimeout(() => app.core.showScreensaver(), cfg.timeoutMs);
                },
                initScreensaver: () => {
                    ['pointerdown', 'keydown', 'touchstart', 'mousedown'].forEach((evt) => {
                        window.addEventListener(evt, () => app.core.registerUserActivity(evt), { passive: true });
                    });
                    window.addEventListener('akari:user-input', () => app.core.registerUserActivity('akari:user-input'));
                    app.core.registerUserActivity('init');
                },
                loadModule: (key, src, label) => {
                    return new Promise((resolve) => {
                        if (!src || src === 'off') { resolve(); return; }
                        const s = document.createElement('script');
                        s.src = resolveModulePath(src);
                        s.onload = () => { app.ui.log(label + ' OK.'); resolve(); };
                        s.onerror = () => { app.ui.log('Failed: ' + label); resolve(); };
                        document.head.appendChild(s);
                    });
                },
                handleInput: () => {
                    const box = document.getElementById('box');
                    const val = box && box.value.trim();
                    if (!val) return;
                    app.isSilentMode = true;
                    window.dispatchEvent(new CustomEvent('akari:user-input', { detail: { source: 'text', value: val } }));
                    window.emit('user_input_received', { source: 'text', text: val, timestamp: Date.now() });
                    window.bubble_incoming(val);
                    box.value = '';
                    app.core.syncActionButton(true);
                    app.ui.setTyping('Akari');
                    if (val.toLowerCase().includes('settings')) {
                        app.ui.openWindow('../settings/index.html');
                        app.core.say('Opening settings panel.');
                        return;
                    }
                    if (window.respond) window.respond(val);
                },
                say: (text) => {
                    app.ui.setTyping(null);
                    window.bubble(text);
                    window.emit('assistant_response', { text: text, timestamp: Date.now() });
                    app.notify('Akari', text, { borderColors: ['#A020F0', '#00FF00'] });
                    window.emote(text);
                    if (!app.isSilentMode) window.speak(text);
                    app.isSilentMode = false;
                },
                appendBubble: (text, className) => {
                    const container = document.getElementById('messages-container');
                    const legacyContainer = document.getElementById('messages');
                    if (!container) return;
                    const div = document.createElement('div');
                    div.className = className; div.innerHTML = text;
                    container.appendChild(div);
                    if (legacyContainer) legacyContainer.appendChild(div.cloneNode(true));
                    container.scrollTop = container.scrollHeight;
                    if (!document.getElementById('chat-box').classList.contains('collapsed')) app.ui.resetAutoMin();
                },
                syncActionButton: (forceVoice) => {
                    const btn = document.getElementById('micbutton');
                    const box = document.getElementById('box');
                    if (!btn) return;
                    if (btn.innerText === 'Listening...' && !forceVoice) return;
                    const hasText = !!(box && box.value.trim());
                    btn.className = 'icemorphic-medium ice-button side-action';
                    btn.style.minWidth = hasText && !forceVoice ? '52px' : '72px';
                    btn.style.fontSize = hasText && !forceVoice ? '18px' : '';
                    if (hasText && !forceVoice) {
                        btn.innerText = '\u27A4';
                        btn.setAttribute('aria-label', 'Send');
                    } else {
                        btn.innerText = 'voice';
                        btn.setAttribute('aria-label', 'Voice');
                    }
                },
                onActionButton: () => {
                    const btn = document.getElementById('micbutton');
                    if (btn && (btn.innerText === '\u27A4' || btn.innerText === '➤')) {
                        app.core.handleInput();
                        return;
                    }
                    app.core.toggleVoice();
                },
                toggleVoice: () => {
                    const btn = document.getElementById('micbutton');
                    app.isSilentMode = false;
                    window.dispatchEvent(new CustomEvent('akari:user-input', { detail: { source: 'voice-toggle' } }));
                    if (btn.innerText === 'voice' || btn.innerText === '\u27A4' || btn.innerText === '➤') {
                        btn.className = 'icemorphic-medium ice-button side-action mic-on';
                        btn.innerText = 'Listening...';
                        btn.style.minWidth = '100px';
                        btn.style.fontSize = '';
                        if (window.whisperTranscriber) whisperTranscriber.start(true);
                        window.emit('voice_listening_started', { timestamp: Date.now() });
                    } else {
                        app.ui.resetMic();
                        window.emit('voice_listening_stopped', { timestamp: Date.now() });
                    }
                },
                getGreeting: () => {
                    const hr = new Date().getHours();
                    if (hr < 12) return 'Good morning.';
                    if (hr < 18) return 'Good afternoon.';
                    return 'Good evening.';
                }
            }
        };
        function typing(tyname) { app.ui.setTyping(tyname); }
        function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
        document.addEventListener('transcriptionComplete', (e) => {
            if (e.detail && e.detail.text) {
                window.dispatchEvent(new CustomEvent('akari:user-input', { detail: { source: 'voice', value: e.detail.text } }));
                app.core.appendBubble(e.detail.text, 'command');
                if (window.respond) window.respond(e.detail.text);
            }
            app.ui.resetMic();
        });
        window.onload = app.core.init;
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('chatToggle');
            const box = document.getElementById('chat-box');
            if (btn) btn.addEventListener('click', () => app.ui.toggleChat());
            if (btn && box && box.classList.contains('collapsed')) btn.innerText = '+';
        });
    </script>
</body>
</html>
