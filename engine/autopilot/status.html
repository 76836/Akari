<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autopilot Status</title>
    <style>
        :root {
            --hsr-blue: #00e5ff;
            --hsr-dark: #020617;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: black;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
            display: flex; justify-content: center; align-items: center;
        }

        .glass-scanner {
            position: absolute; top: -50vh; left: -40%;
            width: 220px; height: 200vh;
            background: rgba(255, 255, 255, 0.05);
            filter: invert(100%);
            border-left: 4px solid rgba(0, 229, 255, 0.3);
            border-right: 2px solid rgba(255, 50, 50, 0.3);
            box-shadow: -5px 0 15px rgba(0, 229, 255, 0.1), 5px 0 15px rgba(255, 50, 50, 0.1);
            transform: rotate(10deg);
            animation: sweep 10s cubic-bezier(0.4, 0, 0.2, 0.1) infinite;
            z-index: 10; pointer-events: none;
        }

        @keyframes sweep {
            0% { left: -50%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 150%; opacity: 0; }
        }

        .container {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; z-index: 5;
        }

        .progress-container {
            width: 90%; max-width: 800px; position: relative;
        }

        .time-text {
            font-family: monospace;
            font-size: 2.5rem;
            font-weight: bold;
            letter-spacing: 4px;
            color: white;
            display: none;
        }

        .corner-accent {
            position: absolute; width: 1.5rem; height: 1.5rem;
            border-color: white; border-style: solid; z-index: 6;
        }
        .top-left { top: -15px; left: -15px; border-width: 4px 0 0 4px; }
        .top-right { top: -15px; right: -15px; border-width: 4px 4px 0 0; }
        .bottom-left { bottom: -15px; left: -15px; border-width: 0 0 4px 4px; }
        .bottom-right { bottom: -15px; right: -15px; border-width: 0 4px 4px 0; }

        .progress-outer {
            background-color: rgba(0, 0, 0, 0.8);
            position: relative; display: block;
        }

        .bar-section {
            border: 2px solid white; padding: 1rem;
            border-bottom: 2px solid white; position: relative;
        }

        .progress-inner {
            position: relative; height: 2.5rem; width: 100%;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(to right,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.8),
                rgba(255, 255, 255, 1));
            transition: width 0.35s ease-out;
            position: relative;
        }

        .scanline {
            position: absolute; inset: 0;
            background: linear-gradient(transparent 49%, rgba(255,255,255,0.1) 50%, transparent 51%);
            animation: scanline 2s linear infinite;
            background-size: 100% 12px;
            pointer-events: none;
        }

        @keyframes scanline {
            from { background-position: 0 0; }
            to { background-position: 0 100%; }
        }

        .percentage {
            position: absolute; right: 0.5rem; top: 50%;
            transform: translateY(-50%);
            background: black; padding: 2px 8px;
            border: 1px solid white; color: white;
            font-family: monospace; font-size: 0.9rem; z-index: 2;
        }

        .info-section {
            border: 2px solid white; margin-top: 1rem;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.03);
            text-align: left; font-family: monospace;
            font-size: 1rem; width: min(90%, 420px);
            letter-spacing: 1px; word-break: break-word;
        }

        .corner-spinner {
            position: fixed; bottom: 40px; right: 40px;
            width: 120px; height: 120px; z-index: 1;
            animation: spin 3s linear infinite;
        }

        .plus-shape { position: relative; width: 100%; height: 100%; }
        .plus-shape::before, .plus-shape::after {
            content: ''; position: absolute; background: white;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .plus-shape::before { width: 36px; height: 100%; }
        .plus-shape::after { width: 100%; height: 36px; }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        #particles { position: absolute; width: 100%; height: 100%; z-index: 1; }
        .star {
            position: absolute; width: 36px; height: 6px;
            background: white; border-radius: 0%;
            animation: moveStar linear infinite;
        }
        @keyframes moveStar {
            from { left: 110%; }
            to { left: -10%; }
        }
    </style>
</head>
<body>
    <div id="particles"></div>
    <div class="glass-scanner"></div>

    <div class="corner-spinner">
        <div class="plus-shape"></div>
    </div>

    <div class="container">
        <div class="progress-container">
            <div class="corner-accent top-left"></div>
            <div class="corner-accent top-right"></div>
            <div class="corner-accent bottom-left"></div>
            <div class="corner-accent bottom-right"></div>

            <div class="progress-outer">
                <div class="bar-section" id="bar-section">
                    <div class="progress-inner" id="progress-inner">
                        <div class="progress-fill" id="progress"></div>
                        <div class="scanline"></div>
                        <div class="percentage" id="percent-text">0%</div>
                        <div class="time-text" id="time-val"></div>
                    </div>
                </div>
                <div class="info-section" id="status">Autopilot standby</div>
            </div>
        </div>
    </div>

    <script>
        let busyMode = false;
        let lastBusyAt = 0;
        let clockRaf = null;

        function createStars() {
            const p = document.getElementById('particles');
            for (let i = 0; i < 80; i++) {
                const s = document.createElement('div');
                s.className = 'star';
                const duration = 8 + Math.random() * 12;
                Object.assign(s.style, {
                    top: Math.random() * 100 + '%',
                    opacity: Math.random() * 0.9,
                    animationDuration: duration + 's',
                    animationDelay: -(Math.random() * duration) + 's'
                });
                p.appendChild(s);
            }
        }

        function setClockMode(on) {
            const progress = document.getElementById('progress');
            const percentText = document.getElementById('percent-text');
            const timeDisplay = document.getElementById('time-val');
            const inner = document.getElementById('progress-inner');
            const bar = document.getElementById('bar-section');

            if (on) {
                progress.style.display = 'none';
                percentText.style.display = 'none';
                timeDisplay.style.display = 'block';
                inner.style.height = 'auto';
                inner.style.background = 'transparent';
                inner.style.border = 'none';
                bar.style.minHeight = '4rem';
                bar.style.display = 'flex';
                bar.style.alignItems = 'center';
                bar.style.justifyContent = 'center';
            } else {
                progress.style.display = 'block';
                percentText.style.display = 'block';
                timeDisplay.style.display = 'none';
                inner.style.height = '2.5rem';
                inner.style.background = 'rgba(255,255,255,0.05)';
                inner.style.border = '1px solid rgba(255,255,255,0.2)';
                bar.style.minHeight = '';
                bar.style.display = 'block';
            }
        }

        function updateClock() {
            if (busyMode) {
                clockRaf = requestAnimationFrame(updateClock);
                return;
            }
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('time-val').innerText = h + ':' + m + ' //Autopilot standby';

            const days = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            // Only overwrite status when idle (no recent busy message)
            if (Date.now() - lastBusyAt > 2000) {
                document.getElementById('status').innerText =
                    days[now.getDay()] + ' ' + months[now.getMonth()] + ' ' + now.getDate() + ' ' + now.getFullYear();
            }
            clockRaf = requestAnimationFrame(updateClock);
        }

        function applyStatus(msg) {
            if (!msg || typeof msg !== 'object') return;
            const text = msg.text || msg.status || '';
            const percent = typeof msg.percent === 'number' ? msg.percent : null;
            const busy = !!(msg.busy || msg.download || (percent != null && percent < 100));

            if (text) {
                document.getElementById('status').innerText = text;
                lastBusyAt = Date.now();
            }

            if (busy) {
                busyMode = true;
                setClockMode(false);
                if (percent != null) {
                    const display = Math.max(0, Math.min(100, Math.round(percent)));
                    document.getElementById('progress').style.width = display + '%';
                    document.getElementById('percent-text').innerText = display + '%';
                } else {
                    // Indeterminate: pulse width
                    document.getElementById('progress').style.width = '35%';
                    document.getElementById('percent-text').innerText = '…';
                }
            } else if (msg.idle || msg.busy === false) {
                busyMode = false;
                setClockMode(true);
                document.getElementById('progress').style.width = '0%';
            }
        }

        function readShared() {
            try {
                const raw = localStorage.getItem('akari:autopilot');
                if (raw) applyStatus(JSON.parse(raw));
            } catch (e) {}
        }

        function init() {
            createStars();
            setClockMode(true);
            updateClock();
            readShared();

            try {
                const bc = new BroadcastChannel('akarinet-autopilot');
                bc.onmessage = (e) => applyStatus(e.data);
            } catch (e) {}

            window.addEventListener('storage', (e) => {
                if (e.key === 'akari:autopilot' && e.newValue) {
                    try { applyStatus(JSON.parse(e.newValue)); } catch (err) {}
                }
            });

            // Parent page may postMessage
            window.addEventListener('message', (e) => {
                if (e.data && e.data.channel === 'akarinet-autopilot') {
                    applyStatus(e.data);
                }
            });
        }

        window.onload = init;
    </script>
</body>
</html>
